<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>减肥助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--primary:#4CAF50;--primary-light:#81C784;--primary-dark:#388E3C;--accent:#2196F3;--warn:#FF9800;--danger:#f44336;--bg:#f5f5f5;--card:#fff;--text:#333;--text-light:#999;--border:#e0e0e0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}
#app{min-height:100vh;padding-bottom:60px}
.hidden{display:none!important}
.page{display:none;animation:fadeIn .2s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* Header */
.page-header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:16px 20px;text-align:center;position:sticky;top:0;z-index:100}
.page-header h1{font-size:18px;font-weight:600}
.page-header .date{font-size:12px;opacity:.85;margin-top:4px}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;border-top:1px solid var(--border);z-index:1000}
.nav-item{flex:1;text-align:center;padding:8px 0;cursor:pointer;transition:color .2s}
.nav-item .icon{font-size:22px;display:block;line-height:1.2}
.nav-item .label{font-size:11px;color:var(--text-light)}
.nav-item.active .icon,.nav-item.active .label{color:var(--primary)}

/* Cards */
.card{background:var(--card);border-radius:12px;margin:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}

/* Home Dashboard */
.calorie-ring-wrap{display:flex;align-items:center;justify-content:center;padding:16px 0}
.calorie-ring{position:relative;width:200px;height:200px}
.calorie-ring svg{transform:rotate(-90deg)}
.calorie-ring .center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.calorie-ring .center .num{font-size:32px;font-weight:700;color:var(--primary)}
.calorie-ring .center .label{font-size:12px;color:var(--text-light)}
.calorie-ring .center .sub{font-size:11px;color:var(--text-light);margin-top:4px}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 12px}
.stat-card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
.stat-card .stat-icon{font-size:24px;margin-bottom:6px}
.stat-card .stat-val{font-size:18px;font-weight:600}
.stat-card .stat-label{font-size:11px;color:var(--text-light);margin-top:2px}
.stat-card .stat-bar{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.stat-card .stat-bar-fill{height:100%;border-radius:2px;transition:width .3s}

.quick-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px}
.quick-btn{background:#fff;border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;transition:transform .1s}
.quick-btn:active{transform:scale(.95)}
.quick-btn .q-icon{font-size:24px}
.quick-btn .q-label{font-size:12px;margin-top:4px;color:var(--text-light)}

/* Diet View */
.meal-section{margin:12px;border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.meal-header{padding:12px 16px;background:#f9f9f9;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.meal-header .meal-name{font-weight:600;font-size:14px}
.meal-header .meal-cal{font-size:13px;color:var(--primary)}
.meal-items{padding:0 16px}
.meal-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0}
.meal-item:last-child{border-bottom:none}
.meal-item .food-name{font-size:14px}
.meal-item .food-amount{font-size:12px;color:var(--text-light)}
.meal-item .food-cal{font-size:14px;font-weight:600;color:var(--primary)}
.meal-item .del-btn{color:var(--danger);cursor:pointer;font-size:18px;margin-left:8px}
.meal-empty{text-align:center;padding:16px;color:var(--text-light);font-size:13px}
.meal-add-btn{display:block;text-align:center;padding:10px;color:var(--primary);font-size:13px;cursor:pointer;border-top:1px solid #f0f0f0}

/* Search Modal */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:2000;display:flex;align-items:flex-end;justify-content:center}
.modal-overlay .modal{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;max-height:80vh;display:flex;flex-direction:column}
.modal-header{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:16px}
.modal-close{font-size:24px;cursor:pointer;color:var(--text-light)}
.search-box{padding:12px 16px}
.search-box input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none}
.cat-tabs{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto}
.cat-tab{padding:6px 12px;border-radius:16px;font-size:12px;white-space:nowrap;cursor:pointer;background:#f0f0f0}
.cat-tab.active{background:var(--primary);color:#fff}
.food-list{flex:1;overflow-y:auto;padding:0 16px 16px}
.food-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0f0f0;cursor:pointer}
.food-item .f-name{font-size:14px}
.food-item .f-cal{font-size:13px;color:var(--text-light)}
.amount-input{display:flex;align-items:center;gap:8px}
.amount-input input{width:60px;padding:6px;border:1px solid var(--border);border-radius:6px;text-align:center;font-size:14px}
.amount-input .unit{font-size:12px;color:var(--text-light)}

/* Exercise View */
.ai-rec-card{margin:12px;background:linear-gradient(135deg,#E3F2FD,#BBDEFB);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ai-rec-card .ai-title{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:8px}
.ai-rec-card .ai-plan{font-size:13px;line-height:1.8}
.ai-rec-card .ai-plan .ex-line{display:flex;justify-content:space-between;padding:4px 0}
.ai-rec-card .ai-plan .ex-name{flex:1}
.ai-rec-card .ai-plan .ex-detail{color:var(--accent)}
.ai-rec-card .ai-total{margin-top:8px;padding-top:8px;border-top:1px solid rgba(33,150,243,.2);font-weight:600;color:var(--accent)}

.exercise-list{margin:12px}
.exercise-item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border-radius:8px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.exercise-item .ex-info .ex-name{font-size:14px;font-weight:500}
.exercise-item .ex-info .ex-meta{font-size:12px;color:var(--text-light);margin-top:2px}
.exercise-item .ex-cal{font-size:16px;font-weight:700;color:var(--warn)}

.exercise-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 12px}
.ex-option{background:#fff;border-radius:8px;padding:10px;text-align:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ex-option:active{transform:scale(.97)}
.ex-option .ex-opt-name{font-size:13px}
.ex-option .ex-opt-meta{font-size:11px;color:var(--text-light);margin-top:2px}

/* Water View */
.water-progress{margin:12px;background:linear-gradient(135deg,#E1F5FE,#B3E5FC);border-radius:12px;padding:20px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.water-circle{position:relative;width:160px;height:160px;margin:0 auto}
.water-circle svg{transform:rotate(-90deg)}
.water-circle .center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.water-circle .center .water-val{font-size:28px;font-weight:700;color:var(--accent)}
.water-circle .center .water-label{font-size:12px;color:var(--text-light)}

.water-quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px}
.water-btn{background:#fff;border-radius:12px;padding:14px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;transition:transform .1s}
.water-btn:active{transform:scale(.95)}
.water-btn .w-icon{font-size:24px}
.water-btn .w-amount{font-size:13px;margin-top:4px;color:var(--accent)}

.water-timeline{margin:12px;background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.water-timeline .tl-title{font-size:14px;font-weight:600;margin-bottom:12px}
.water-timeline .tl-item{display:flex;align-items:center;padding:6px 0}
.water-timeline .tl-time{font-size:13px;color:var(--text-light);width:60px}
.water-timeline .tl-amount{font-size:13px;font-weight:500}
.water-timeline .tl-status{margin-left:auto;font-size:12px}
.water-timeline .tl-status.done{color:var(--primary)}
.water-timeline .tl-status.pending{color:var(--warn)}

/* Check-in View */
.checkin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px}
.checkin-item{background:#fff;border-radius:12px;padding:20px 16px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer}
.checkin-item .ci-icon{font-size:32px;margin-bottom:8px}
.checkin-item .ci-name{font-size:14px;font-weight:500}
.checkin-item .ci-status{font-size:12px;margin-top:4px;color:var(--text-light)}
.checkin-item.done{background:linear-gradient(135deg,#E8F5E9,#C8E6C9)}
.checkin-item.done .ci-status{color:var(--primary)}

.streak-card{margin:12px;background:linear-gradient(135deg,#FFF3E0,#FFE0B2);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
.streak-card .streak-num{font-size:36px;font-weight:700;color:var(--warn)}
.streak-card .streak-label{font-size:14px;color:#E65100}
.streak-card .streak-sub{font-size:12px;color:var(--text-light);margin-top:4px}

.weekly-stats{margin:12px;background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.weekly-stats .ws-title{font-size:14px;font-weight:600;margin-bottom:12px}
.week-bars{display:flex;justify-content:space-between;align-items:flex-end;height:100px;gap:4px}
.week-bar-wrap{flex:1;text-align:center}
.week-bar{background:var(--border);border-radius:4px 4px 0 0;margin:0 auto;transition:height .3s}
.week-bar.active{background:var(--primary)}
.week-bar-wrap .week-day{font-size:10px;color:var(--text-light);margin-top:4px}

/* Tips View */
.tip-card{margin:12px;background:linear-gradient(135deg,#F3E5F5,#E1BEE7);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tip-card .tip-badge{display:inline-block;background:#fff;padding:2px 8px;border-radius:10px;font-size:11px;color:#7B1FA2;margin-bottom:8px}
.tip-card .tip-content{font-size:14px;line-height:1.8;color:#4A148C}
.tip-card .tip-fav{margin-top:12px;text-align:right;font-size:20px;cursor:pointer}

.tip-list-item{margin:12px;background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tip-list-item .tl-content{font-size:13px;line-height:1.6}
.tip-list-item .tl-fav{margin-top:8px;font-size:16px;cursor:pointer;float:right}

/* Profile View */
.profile-header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:24px 20px;text-align:center}
.profile-header .avatar{width:64px;height:64px;background:rgba(255,255,255,.2);border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:28px}
.profile-header .name{font-size:18px;font-weight:600}
.profile-header .sub{font-size:13px;opacity:.85;margin-top:4px}

.weight-chart{margin:12px;background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.weight-chart canvas{width:100%;height:160px}

.progress-section{margin:12px;background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.progress-bar-wrap{height:8px;background:var(--border);border-radius:4px;margin:12px 0;overflow:hidden;position:relative}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));border-radius:4px;transition:width .3s}
.progress-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--text-light)}

.profile-menu{margin:12px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.menu-item{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.menu-item:last-child{border-bottom:none}
.menu-item .mi-label{font-size:14px}
.menu-item .mi-value{font-size:13px;color:var(--text-light)}
.menu-item .mi-arrow{color:var(--text-light)}

/* Edit Modal */
.edit-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:2000;display:flex;align-items:center;justify-content:center}
.edit-modal .edit-content{background:#fff;border-radius:16px;width:90%;max-width:400px;padding:20px}
.edit-modal .edit-title{font-size:16px;font-weight:600;text-align:center;margin-bottom:16px}
.edit-field{margin-bottom:12px}
.edit-field label{display:block;font-size:13px;color:var(--text-light);margin-bottom:4px}
.edit-field input,.edit-field select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none}
.edit-btns{display:flex;gap:12px;margin-top:16px}
.edit-btns button{flex:1;padding:10px;border-radius:8px;font-size:14px;cursor:pointer;border:none}
.edit-btns .btn-cancel{background:#f0f0f0;color:var(--text)}
.edit-btns .btn-save{background:var(--primary);color:#fff}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:3000;animation:toastIn .3s}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* Misc */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-light)}
.empty-state .es-icon{font-size:48px;margin-bottom:8px;opacity:.3}
.empty-state .es-text{font-size:14px}
.total-cal-bar{position:sticky;bottom:56px;background:#fff;padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;z-index:50}
.total-cal-bar .tcl-label{font-size:14px}
.total-cal-bar .tcl-value{font-size:18px;font-weight:700;color:var(--primary)}
.section-label{font-size:13px;color:var(--text-light);margin:16px 12px 8px;font-weight:500}
</style>
</head>
<body>
<div id="app">
  <!-- Home Page -->
  <div class="page active" id="page-home">
    <div class="page-header">
      <h1>减肥助手</h1>
      <div class="date" id="home-date"></div>
    </div>
    <div class="calorie-ring-wrap">
      <div class="calorie-ring" id="calorie-ring"></div>
    </div>
    <div class="stat-grid" id="home-stats"></div>
    <div class="quick-actions">
      <div class="quick-btn" onclick="switchPage('diet')">
        <div class="q-icon">🍳</div>
        <div class="q-label">记饮食</div>
      </div>
      <div class="quick-btn" onclick="switchPage('exercise')">
        <div class="q-icon">🏃</div>
        <div class="q-label">记运动</div>
      </div>
      <div class="quick-btn" onclick="switchPage('water')">
        <div class="q-icon">💧</div>
        <div class="q-label">记喝水</div>
      </div>
    </div>
    <div class="card" id="home-tip-card"></div>
    <div class="card" id="home-checkin-status"></div>
  </div>

  <!-- Diet Page -->
  <div class="page" id="page-diet">
    <div class="page-header">
      <h1>饮食记录</h1>
      <div class="date" id="diet-date"></div>
    </div>
    <div id="diet-meals"></div>
    <div class="total-cal-bar">
      <span class="tcl-label">今日总摄入</span>
      <span class="tcl-value" id="diet-total-cal">0 kcal</span>
    </div>
  </div>

  <!-- Exercise Page -->
  <div class="page" id="page-exercise">
    <div class="page-header">
      <h1>运动记录</h1>
      <div class="date" id="exercise-date"></div>
    </div>
    <div id="exercise-content"></div>
    <div class="total-cal-bar">
      <span class="tcl-label">今日运动消耗</span>
      <span class="tcl-value" id="exercise-total-cal" style="color:var(--warn)">0 kcal</span>
    </div>
  </div>

  <!-- Water Page -->
  <div class="page" id="page-water">
    <div class="page-header">
      <h1>饮水助手</h1>
      <div class="date" id="water-date"></div>
    </div>
    <div class="water-progress">
      <div class="water-circle" id="water-circle"></div>
    </div>
    <div class="water-quick" id="water-quick"></div>
    <div class="water-timeline" id="water-timeline"></div>
  </div>

  <!-- Profile Page -->
  <div class="page" id="page-profile">
    <div class="profile-header" id="profile-header"></div>
    <div class="progress-section" id="profile-progress"></div>
    <div class="weight-chart" id="profile-chart"></div>
    <div class="card" id="profile-checkin-summary"></div>
    <div class="section-label">减肥知识</div>
    <div class="card" id="profile-tip-preview" style="cursor:pointer" onclick="switchPage('tips')"></div>
    <div class="section-label">设置</div>
    <div class="profile-menu" id="profile-menu"></div>
  </div>

  <!-- Tips Page (hidden, shown as overlay) -->
  <div class="page" id="page-tips">
    <div class="page-header">
      <h1>减肥知识</h1>
      <div class="date">每日一点，科学减肥</div>
    </div>
    <div class="tip-card" id="tip-today"></div>
    <div class="section-label">全部知识</div>
    <div id="tip-list"></div>
  </div>

  <!-- Check-in Page (hidden, shown as overlay) -->
  <div class="page" id="page-checkin">
    <div class="page-header">
      <h1>每日打卡</h1>
      <div class="date" id="checkin-date"></div>
    </div>
    <div class="streak-card" id="checkin-streak"></div>
    <div class="checkin-grid" id="checkin-grid"></div>
    <div class="weekly-stats" id="checkin-weekly"></div>
  </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav" id="bottom-nav">
  <div class="nav-item active" data-page="home" onclick="switchPage('home')">
    <span class="icon">📊</span><span class="label">概览</span>
  </div>
  <div class="nav-item" data-page="diet" onclick="switchPage('diet')">
    <span class="icon">🍳</span><span class="label">饮食</span>
  </div>
  <div class="nav-item" data-page="exercise" onclick="switchPage('exercise')">
    <span class="icon">🏃</span><span class="label">运动</span>
  </div>
  <div class="nav-item" data-page="water" onclick="switchPage('water')">
    <span class="icon">💧</span><span class="label">饮水</span>
  </div>
  <div class="nav-item" data-page="profile" onclick="switchPage('profile')">
    <span class="icon">👤</span><span class="label">我的</span>
  </div>
</div>

<script>
// ==================== DATABASES ====================

const FOOD_DB = [
  // 主食
  {name:'白米饭',cat:'主食',cal:116,unit:'g',def:200},

  {name:'燕麦片(干)',cat:'主食',cal:377,unit:'g',def:40},
  {name:'红薯',cat:'主食',cal:86,unit:'g',def:200},
  {name:'紫薯',cat:'主食',cal:82,unit:'g',def:200},
  {name:'土豆',cat:'主食',cal:76,unit:'g',def:150},
  {name:'玉米',cat:'主食',cal:86,unit:'g',def:200},
  {name:'小米粥',cat:'主食',cal:46,unit:'g',def:300},
  {name:'米粉',cat:'主食',cal:110,unit:'g',def:200},
  {name:'饺子',cat:'主食',cal:250,unit:'g',def:150},
  {name:'包子',cat:'主食',cal:227,unit:'g',def:100},
  {name:'油条',cat:'主食',cal:388,unit:'g',def:80},
  {name:'烙饼',cat:'主食',cal:225,unit:'g',def:100},

const TIPS_DB = [
  '【能量代谢】脂肪分解不是简单的"热量进vs热量出"。人体存在适应性产热（Adaptive Thermogenesis）：当你持续热量缺口时，基础代谢率会下降5-15%，这是身体的生存保护机制。对策：每8-12周安排一次"维持期"（恢复TDEE热量摄入1-2周），让代谢重启后再继续减脂，可突破代谢适应导致的平台期。',
  '【胰岛素与脂肪储存】胰岛素是脂肪储存的主控开关。精制碳水→血糖飙升→胰岛素飙升→脂肪储存模式开启，同时抑制脂肪分解酶（HSL）。选择低GI食物（GI<55）可使胰岛素平稳释放，如糙米GI=50 vs 白米饭GI=83。每餐先吃蔬菜和蛋白质、最后吃碳水，可使餐后血糖峰值降低37%。',
  '【皮质醇与内脏脂肪】慢性压力→皮质醇持续升高→激活脂肪细胞内HSD酶系→脂肪优先沉积于腹部内脏（而非皮下）。腹部脂肪细胞皮质醇受体密度是臀部脂肪的4倍。高皮质醇还会加速肌肉分解供能（糖异生），导致代谢率进一步下降。有效对策：每天10分钟深呼吸（4-7-8呼吸法）、每周2次中等强度运动、保证深度睡眠。',
  '【运动后过量氧耗(EPOC)】高强度间歇运动（HIIT）后，肌体需要补充ATP、清除乳酸、修复肌糖原、恢复体温，这些过程在运动后24-48小时内持续耗能，即EPOC。研究显示20分钟HIIT的EPOC可消耗额外150-300kcal，而30分钟匀速有氧的EPOC仅约30-50kcal。建议每周2-3次HIIT（如Tabata: 20秒全力+10秒休息×8组）配合低强度有氧。',
  '【蛋白质与食物热效应(TEF)】三大营养素的食物热效应差异巨大：蛋白质TEF=20-30%（吃100kcal蛋白质实际净吸收70-80kcal）、碳水TEF=5-10%、脂肪TEF=0-3%。高蛋白饮食（1.6-2.2g/kg/天）不仅通过TEF多消耗热量，还通过激活mTOR通路促进肌肉合成、提高饱腹感激素PYY和GLP-1分泌、抑制饥饿激素Ghrelin。',
  '【瘦素与饥饿激素】瘦素（Leptin）由脂肪细胞分泌，本应告诉大脑"脂肪储备充足，停止进食"。但肥胖者存在瘦素抵抗——大脑收不到信号。减肥时脂肪减少→瘦素下降→大脑启动"饥饿模式"。对策：避免极端低热量饮食（不低于BMR），补充Omega-3脂肪酸（EPA+DHA 2g/天）可改善瘦素敏感性，每周安排一次refeed day（碳水提高50%）可短暂提升瘦素。',
  '【肌纤维类型与燃脂】慢肌纤维（I型）富含线粒体、毛细血管密度高，适合有氧脂肪氧化；快肌纤维（II型）爆发力强但依赖糖酵解。长时间低强度运动（60%最大心率）优先动员脂肪，因为此时脂肪氧化酶活性最高。但如果想持续提升燃脂能力，需要通过力量训练增加整体肌肉量——每增加1kg肌肉，BMR约提高13kcal/天。',
  '【空腹有氧的利弊】空腹状态下胰岛素低、肾上腺素高，理论上脂肪氧化比例更高。但研究显示空腹有氧与餐后有氧在24小时总脂肪氧化上差异不大，且空腹有氧可能导致肌肉分解（蛋白质糖异生）和运动强度下降。建议：如果你习惯晨练，空腹快走30-40分钟可以，但强度高的跑步或HIIT应餐后1-2小时进行，避免肌肉流失。',
  '【Omega-3与脂肪氧化】EPA和DHA通过激活PPAR-α受体上调脂肪酸氧化酶（CPT-1）表达，同时下调脂肪合成酶（FAS）。每天2-3g EPA+DHA可使脂肪氧化率提升15-25%。来源：深海鱼（三文鱼100g含2.3g）、鱼油补剂、亚麻籽（含ALA转化率约5%）。注意鱼油要选IFOS认证的，避免重金属污染。',
  '【肠道菌群与肥胖】肠道菌群的厚壁菌门/拟杆菌门比值（F/B ratio）与肥胖相关：肥胖者F/B偏高，菌群从食物中提取能量的效率更高（多提取约150kcal/天）。高纤维饮食（每天25-30g膳食纤维）可促进拟杆菌增殖，发酵产生短链脂肪酸（丁酸），增强肠屏障、减少内毒素入血、改善胰岛素敏感性。建议每天摄入1-2种发酵食品（无糖酸奶、泡菜、纳豆）。',
  '【糖原与水分的关系】减重初期掉得快主要是糖原消耗+水分丢失。1g糖原绑定3-4g水分，肝糖原储存约100g、肌糖原约400g，合计500g糖原+1500-2000g水=2-2.5kg。低碳/断食初期可掉3-5kg，但恢复饮食后迅速回弹。真正的脂肪减少需要持续热量缺口7700kcal/kg脂肪。关注体脂率而非体重更科学。',
  '【NEAT的重要性】非运动性活动产热（NEAT）包括站立、走动、抖腿、做家务等，在久坐人群中占TDEE的15%，在活跃人群中可达50%。研究显示瘦的人每天比胖的人多NEAT消耗约350kcal。对策：站立办公（每小时多消耗40-50kcal vs 坐着）、打电话时走动、每坐45分钟起身5分钟。这些碎片活动累计效应远超单独健身房1小时。',
  '【进食速度与GLP-1】进食后肠道分泌GLP-1和PYY（饱腹感激素），但从进食到信号到达大脑约需15-20分钟。快速进食者在信号到达前已摄入过量热量。每口咀嚼20次以上、每餐持续20分钟以上可使饱腹感激素充分释放，自然减少摄入量15-20%。对策：放下筷子咀嚼、用非惯用手进食、餐前喝300ml水。',
  '【环境温度与棕色脂肪】人体存在棕色脂肪组织（BAT），富含线粒体，可直接氧化脂肪产热。BAT在寒冷刺激下激活（16-19°C环境），UCP1蛋白解偶联氧化磷酸化，将脂肪直接转化为热量。研究显示每天2小时19°C环境可显著增加BAT活性和脂肪氧化。冬季适当降低室内温度、冷水浴（15°C 2-3分钟）可刺激BAT。但注意冷刺激会代偿性增加食欲。',
  '【断食与自噬】16:8轻断食模式（16小时不进食）不仅制造热量缺口，还激活自噬（Autophagy）——细胞降解受损蛋白和衰老细胞器。自噬在断食14-16小时后由AMPK通路激活，mTOR抑制。好处：清除代谢废物、改善胰岛素敏感性、减少炎症。注意：断食期间只喝水/黑咖啡/无糖茶，断食窗口内不摄入任何有热量的食物。',
  '【运动强度与脂肪氧化区间】"燃脂心率区"（60-70%最大心率）确实使脂肪供能比例最高，但总量不大。关键区分：低强度时脂肪供能比例高但总消耗低（如快走30min消耗150kcal，脂肪占60%=90kcal）；高强度时脂肪比例低但总消耗高（如HIIT 20min消耗250kcal，脂肪占40%=100kcal）。所以总量上高强度反而燃烧更多脂肪，且有EPOC加成。',
  '【维生素D与代谢】维生素D缺乏（<30ng/ml）在超重人群比例高达60-80%。VDR受体存在于脂肪、肌肉、胰岛β细胞中，维生素D充足可改善胰岛素敏感性、促进脂肪细胞凋亡、上调肌肉蛋白合成。建议检测25(OH)D水平，补充2000-4000IU/天，搭配维生素K2协同作用，注意晒太阳15分钟/天也是天然来源。',
  '【钠与水分滞留】高钠饮食导致水分滞留，体重秤上可能多出1-2kg"假体重"。高盐→血钠升高→ADH分泌→肾脏重吸收水→细胞外液增加。WHO建议每天钠摄入<2000mg（约5g盐），但中国人平均摄入约10g盐。减盐一周后，身体排出多余钠和水分，体重下降1-1.5kg很常见——这不是减脂，但有助于区分真实脂肪和水分。',
  '【碳水化合物与 leptin 信号】碳水摄入对瘦素的影响比脂肪和蛋白质更大。持续低碳饮食1-2周后瘦素下降约30-50%，导致代谢减慢、饥饿感增强。这就是为什么周期性refeed（恢复日）很重要——一顿高碳水餐（碳水占TDEE 50%+）可使瘦素短暂提升约40%，维持代谢率和运动表现。建议每5-7天安排一次高碳水日（不减蛋白不减脂，只增加碳水）。',
  '【乳酸与生长激素】高强度运动产生乳酸，血乳酸浓度升高可刺激垂体前叶分泌生长激素（HGH）。HGH促进脂肪分解（激活HSL）、抑制脂肪合成、促进肌肉合成。30秒全力冲刺可使HGH水平提升2-5倍，持续约1-2小时。这就是为什么力量训练+HIIT比纯匀速有氧更有利于减脂塑形——不仅在运动时消耗，更通过激素效应持续作用。',
  '【咖啡因与运动表现】运动前30-60分钟摄入3-6mg/kg咖啡因（约1-2杯黑咖啡），可提升运动表现5-10%、延长力竭时间、提高脂肪氧化率。机制：咖啡因拮抗腺苷受体→降低疲劳感知→提高运动强度→间接增加热量消耗。注意：每日上限400mg，下午2点后避免摄入以免影响睡眠（咖啡因半衰期5-7小时），睡眠不足反而更胖。',
  '【餐后散步与血糖】餐后30分钟内散步15-20分钟，可使餐后血糖峰值降低20-30%。机制：骨骼肌收缩通过非胰岛素依赖途径（GLUT4转位）摄取葡萄糖，不依赖胰岛素信号。这对胰岛素抵抗人群尤其有效。建议三餐后都走10-15分钟，比集中一次运动1小时对血糖控制更好。武汉的朋友们吃完热干面走两步效果明显。',
  '【压力进食的神经科学】压力→下丘脑CRH→垂体ACTH→肾上腺皮质醇升高→食欲增加（尤其高糖高脂）。皮质醇还使伏隔核（奖赏中枢）对高热量食物反应增强。这种"情绪性进食"不是意志力问题，是HPA轴激活的生理反应。对策：识别情绪饥饿vs生理饥饿（情绪饥饿突然出现、渴望特定食物；生理饥饿逐渐出现、什么都能吃）、用5分钟散步或深呼吸替代进食。',
  '【肌肉量与BMR】每公斤肌肉每天的静息代谢约13kcal，看似不多，但增加5kg肌肉=65kcal/天=23725kcal/年≈3kg脂肪/年。更重要的是肌肉作为"代谢海绵"——肌肉量越大，胰岛素敏感性越好、糖原储备容量越大、运动时能消耗更多热量。力量训练每周3次、每次6-8个复合动作（深蹲/硬拉/卧推/划船/推举）、每组8-12次、3-4组。',
  '【膳食纤维与短链脂肪酸】水溶性纤维（β-葡聚糖、果胶、菊粉）在结肠被菌群发酵为丁酸、丙酸、乙酸。丁酸是结肠细胞主要能源、修复肠屏障、抗炎、促进GLP-1分泌→增加饱腹感。每天25-30g膳食纤维目标，来源：燕麦（β-葡聚糖）、苹果（果胶）、洋葱/大蒜（菊粉）、豆类、全谷物。增加纤维要循序渐进，搭配充足饮水，否则可能胀气。',

  '【LISS vs HIIT的选择策略】LISS（低强度恒定有氧）适合：初学者、体重基数大（保护关节）、恢复日、空腹有氧。HIIT适合：有运动基础、时间有限、想突破平台期。最佳策略是"两极化训练"：80%低强度有氧+20%高强度间歇，这是耐力运动员的训练分配模式，既能最大化脂肪氧化能力，又能获得高强度带来的EPOC和激素效益。',

// ==================== STORAGE ====================

const Store = {
  getUser(){
    let u = localStorage.getItem('diet_user');
    if(u) return JSON.parse(u);
    return {
      height:168, weight:85, startWeight:85, targetWeight:75,
      age:38, gender:'male', period:90
    };
  },
  setUser(u){ localStorage.setItem('diet_user', JSON.stringify(u)); },
  getDay(date){
    let k = 'diet_day_' + date;
    let d = localStorage.getItem(k);
    if(d) return JSON.parse(d);
    return { meals:[], exercises:[], water:[], weight:null, checkIns:{diet:false,exercise:false,water:false,weight:false} };
  },
  setDay(date, d){ localStorage.setItem('diet_day_' + date, JSON.stringify(d)); },
  getWeights(){ let w = localStorage.getItem('diet_weights'); return w ? JSON.parse(w) : []; },
  addWeight(date, w){
    let weights = this.getWeights();
    let exist = weights.find(x => x.date === date);
    if(exist) exist.weight = w;
    else weights.push({date, weight:w});
    weights.sort((a,b) => a.date.localeCompare(b.date));
    localStorage.setItem('diet_weights', JSON.stringify(weights));
  },
  getStreak(){ let s = localStorage.getItem('diet_streak'); return s ? JSON.parse(s) : {total:0, consecutive:0, lastDate:null}; },
  setStreak(s){ localStorage.setItem('diet_streak', JSON.stringify(s)); },
  getTipIndex(){ return parseInt(localStorage.getItem('diet_tip_index')||'0'); },
  setTipIndex(i){ localStorage.setItem('diet_tip_index', String(i)); },
  getFavorites(){ let f = localStorage.getItem('diet_fav_tips'); return f ? JSON.parse(f) : []; },
  toggleFav(idx){
    let favs = this.getFavorites();
    let i = favs.indexOf(idx);
    if(i >= 0) favs.splice(i,1); else favs.push(idx);
    localStorage.setItem('diet_fav_tips', JSON.stringify(favs));
    return favs.includes(idx);
  },
  exportData(){
    let data = { user: this.getUser(), weights: this.getWeights(), streak: this.getStreak() };
    let keys = Object.keys(localStorage).filter(k => k.startsWith('diet_day_'));
    data.days = {};
    keys.forEach(k => { data.days[k] = JSON.parse(localStorage.getItem(k)); });
    return JSON.stringify(data, null, 2);
  }
};

// ==================== CALC ====================

const Calc = {
  today(){ let d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); },
  todayLabel(){ let d = new Date(); let days = ['日','一','二','三','四','五','六']; return (d.getMonth()+1)+'月'+d.getDate()+'日 星期'+days[d.getDay()]; },
  bmr(u){ return Math.round(10*u.weight + 6.25*u.height - 5*u.age + (u.gender==='male'?5:-161)); },
  tdee(u){ return Math.round(this.bmr(u) * 1.375); },
  dailyCalTarget(u){ return Math.max(1500, this.tdee(u) - 913); },
  waterTarget(u){ return Math.round(u.weight * 35); },
  exCalories(met, min, weight){ return Math.round(met * weight * min / 60); },
  bmi(u){ let h = u.height/100; return (u.weight/(h*h)).toFixed(1); },
  mealCalories(record){ return record.meals.reduce((s,m)=>s+m.calories,0); },
  exCaloriesTotal(record){ return record.exercises.reduce((s,e)=>s+e.calories,0); },
  waterTotal(record){ return record.water.reduce((s,w)=>s+w.amount,0); }
};

// ==================== AI RECOMMENDATION ====================

const AI = {
  recommend(user, record){
    let deficit = Calc.dailyCalTarget(user);
    let targetBurn = Math.min(500, Math.max(200, deficit * 0.4));
    let weight = user.weight;
    let plans = [];
    // Plan A: Low intensity - walking
    let walkMin = Math.round(targetBurn * 60 / (3.8 * weight));
    if(walkMin <= 60) plans.push({name:'快走', min:walkMin, cal:targetBurn, level:'轻松'});
    // Plan B: Medium - jogging
    let jogMin = Math.round(targetBurn * 60 / (7.0 * weight));
    if(jogMin <= 40) plans.push({name:'慢跑', min:jogMin, cal:targetBurn, level:'中等'});
    // Plan C: High - jump rope
    let ropeMin = Math.round(targetBurn * 60 / (10.0 * weight));
    if(ropeMin <= 25) plans.push({name:'跳绳', min:ropeMin, cal:targetBurn, level:'高效'});
    // Plan D: Combo
    let comboWalk = 20, comboJog = 15;
    let comboCal = Calc.exCalories(3.8, comboWalk, weight) + Calc.exCalories(7.0, comboJog, weight);
    plans.push({name:'快走+慢跑', min:comboWalk+comboJog, cal:comboCal, level:'推荐组合'});
    // Already exercised today?
    let done = Calc.exCaloriesTotal(record);
    let remaining = Math.max(0, targetBurn - done);
    return { plans, targetBurn, done, remaining };
  }
};

// ==================== NAVIGATION ====================

function switchPage(name){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  let page = document.getElementById('page-' + name);
  if(page){ page.classList.add('active'); window.scrollTo(0,0); }
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  let nav = document.querySelector('.nav-item[data-page="'+name+'"]');
  if(nav) nav.classList.add('active');
  // Render page content
  if(name==='home') renderHome();
  else if(name==='diet') renderDiet();
  else if(name==='exercise') renderExercise();
  else if(name==='water') renderWater();
  else if(name==='profile') renderProfile();
  else if(name==='tips') renderTips();
  else if(name==='checkin') renderCheckin();
}

}

function renderDiet(){
  let today = Calc.today();
  let record = Store.getDay(today);
  let user = Store.getUser();
  let target = Calc.dailyCalTarget(user);
  document.getElementById('diet-date').textContent = Calc.todayLabel();
  let meals = [
    {key:'breakfast', name:'早餐', icon:'🌅'},
    {key:'lunch', name:'午餐', icon:'☀️'},
    {key:'dinner', name:'晚餐', icon:'🌙'},
    {key:'snack', name:'加餐/零食', icon:'🍪'}
  ];
  let html = '';
  let totalCal = 0;
  meals.forEach(m => {
    let items = record.meals.filter(x => x.type === m.key);
    let mealCal = items.reduce((s,x)=>s+x.calories,0);
    totalCal += mealCal;
    html += `<div class="meal-section">
      <div class="meal-header" onclick="openFoodSearch('${m.key}')">
        <span class="meal-name">${m.icon} ${m.name} ${items.length?'('+items.length+')':''}</span>
        <span class="meal-cal">${mealCal} kcal</span>
      </div>
      <div class="meal-items">`;
    if(items.length === 0){
      html += `<div class="meal-empty" style="cursor:pointer" onclick="openFoodSearch('${m.key}');event.stopPropagation();">点击添加${m.name}</div>`;
    } else {
      items.forEach((item, i) => {
        html += `<div class="meal-item">
          <div>
            <div class="food-name">${item.name}</div>
            <div class="food-amount">${item.amount}${item.unit}</div>
          </div>
          <div style="display:flex;align-items:center">
            <span class="food-cal">${item.calories} kcal</span>
            <span class="del-btn" onclick="delMeal('${today}','${m.key}',${i});event.stopPropagation();return false;">×</span>
          </div>
        </div>`;
      });
      html += `<div class="meal-add-btn" onclick="openFoodSearch('${m.key}');event.stopPropagation();">+ 添加食物</div>`;
    }
    html += `</div></div>`;
  });
  document.getElementById('diet-meals').innerHTML = html;
  document.getElementById('diet-total-cal').textContent = totalCal + ' / ' + target + ' kcal';
  document.getElementById('diet-total-cal').style.color = totalCal > target ? '#f44336' : 'var(--primary)';
}

function openFoodSearch(mealType){
  let cats = ['全部','主食','肉蛋','蔬菜','水果','饮品','豆制品','零食','连锁餐饮','油脂'];
  let currentCat = '全部';
  let searchTerm = '';

  let overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'food-search-modal';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h3>选择食物</h3>
        <span class="modal-close" onclick="document.getElementById('food-search-modal').remove()">×</span>
      </div>
      <div class="search-box">
        <input type="text" id="food-search-input" placeholder="搜索食物名称..." oninput="filterFoodList()">
      </div>
      <div class="cat-tabs" id="food-cat-tabs">
        ${cats.map(c => `<span class="cat-tab ${c===currentCat?'active':''}" onclick="selectFoodCat('${c}')">${c}</span>`).join('')}
      </div>
      <div class="food-list" id="food-search-list"></div>
    </div>`;
  document.body.appendChild(overlay);
  overlay._mealType = mealType;
  overlay._cat = currentCat;
  overlay._term = searchTerm;
  renderFoodList();
  document.getElementById('food-search-input').focus();
}

function selectFoodCat(cat){
  let modal = document.getElementById('food-search-modal');
  modal._cat = cat;
  document.querySelectorAll('#food-cat-tabs .cat-tab').forEach(t => {
    t.classList.toggle('active', t.textContent === cat);
  });
  renderFoodList();
}

function filterFoodList(){
  let modal = document.getElementById('food-search-modal');
  modal._term = document.getElementById('food-search-input').value.toLowerCase();
  renderFoodList();
}

function renderFoodList(){
  let modal = document.getElementById('food-search-modal');
  let cat = modal._cat;
  let term = modal._term;
  let list = FOOD_DB.filter(f => {
    let catMatch = cat === '全部' || f.cat === cat;
    let termMatch = !term || f.name.toLowerCase().includes(term);
    return catMatch && termMatch;
  });
  let html = '';
  if(list.length === 0){
    html = '<div class="empty-state"><div class="es-icon">🔍</div><div class="es-text">未找到食物</div></div>';
  } else {
    list.forEach(f => {
      let defCal, calLabel, liveCalc;
      if(f.unit === '份'){
        defCal = Math.round(f.cal * f.def);
        calLabel = f.cal + ' kcal/份';
        liveCalc = 'Math.round(f.cal * (parseInt(this.value)||0))';
      } else {
        defCal = Math.round(f.cal * f.def / 100);
        calLabel = f.cal + ' kcal/100' + f.unit;
        liveCalc = 'Math.round(f.cal * (parseInt(this.value)||0) / 100)';
      }
      html += `<div class="food-item">
        <div>
          <div class="f-name">${f.name}</div>
          <div class="f-cal">${calLabel}</div>
        </div>
        <div class="amount-input">
          <input type="number" id="amt-${f.name}" value="${f.def}" min="1" step="0.5" style="width:50px">
          <span class="unit">${f.unit}</span>
          <span style="color:var(--primary);font-weight:600;margin-left:4px" id="cal-${f.name}">${defCal}</span>kcal
        </div>
        <span style="color:var(--primary);cursor:pointer;margin-left:8px;font-size:18px" onclick="addFoodToMeal('${f.name}','${f.unit}',${f.cal})">+</span>
      </div>`;
      // Live update calories
      setTimeout(()=>{
        let inp = document.getElementById('amt-'+f.name);
        if(inp){
          inp.oninput = function(){
            let val = parseFloat(this.value) || 0;
            let cal;
            if(f.unit === '份') cal = Math.round(f.cal * val);
            else cal = Math.round(f.cal * val / 100);
            let calEl = document.getElementById('cal-'+f.name);
            if(calEl) calEl.textContent = cal;
          };
        }
      },0);
    });
  }
  document.getElementById('food-search-list').innerHTML = html;
}

function addFoodToMeal(name, unit, calPer100){
  let modal = document.getElementById('food-search-modal');
  let mealType = modal._mealType;
  let inp = document.getElementById('amt-'+name);
  let amount = parseFloat(inp.value) || 1;
  let calories;
  if(unit === '份') calories = Math.round(calPer100 * amount);
  else calories = Math.round(calPer100 * amount / 100);
  let today = Calc.today();
  let record = Store.getDay(today);
  record.meals.push({type:mealType, name:name, amount:amount, unit:unit, calories:calories});
  Store.setDay(today, record);
  let amtStr = (amount % 1 === 0) ? amount : amount.toFixed(1);
  toast('已添加: '+name+' '+amtStr+unit+'='+calories+'kcal');
  // Auto-check diet if reached target range
  let total = Calc.mealCalories(record);
  let target = Calc.dailyCalTarget(Store.getUser());
  if(total >= target * 0.8 && total <= target * 1.15) record.checkIns.diet = true;
  Store.setDay(today, record);
  modal.remove();
  renderDiet();
}

function delMeal(date, mealType, idx){
  let record = Store.getDay(date);
  let items = record.meals.filter(x => x.type === mealType);
  let item = items[idx];
  let allIdx = record.meals.findIndex(x => x === item);
  if(allIdx >= 0){
    record.meals.splice(allIdx, 1);
    Store.setDay(date, record);
    renderDiet();
  }
}

function addExercise(name, met){
  let min = parseInt(document.getElementById('ex-duration').value) || 30;
  let user = Store.getUser();
  let cal = Calc.exCalories(met, min, user.weight);
  let today = Calc.today();
  let record = Store.getDay(today);

  let totalMin = record.exercises.reduce((s,e)=>s+e.duration,0);

function delExercise(date, idx){
  let record = Store.getDay(date);
  record.exercises.splice(idx, 1);

}

function renderWater(){
  let today = Calc.today();
  let user = Store.getUser();
  let record = Store.getDay(today);
  let target = Calc.waterTarget(user);
  let total = Calc.waterTotal(record);
  document.getElementById('water-date').textContent = Calc.todayLabel();

  // Water circle
  let pct = Math.min(100, total / target * 100);
  let circumference = 2 * Math.PI * 65;
  let offset = circumference - (pct/100) * circumference;
  let color = pct >= 100 ? '#4CAF50' : '#2196F3';
  document.getElementById('water-circle').innerHTML = `
    <svg width="160" height="160" viewBox="0 0 160 160">
      <circle cx="80" cy="80" r="65" fill="none" stroke="#E1F5FE" stroke-width="10"/>
      <circle cx="80" cy="80" r="65" fill="none" stroke="${color}" stroke-width="10"
        stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round" style="transition:stroke-dashoffset .5s"/>
    </svg>
    <div class="center">
      <div class="water-val">${total}</div>
      <div class="water-label">/${target}ml</div>
    </div>`;

  // Quick add buttons
  document.getElementById('water-quick').innerHTML = `
    <div class="water-btn" onclick="addWater(200)"><div class="w-icon">🥤</div><div class="w-amount">+200ml</div></div>
    <div class="water-btn" onclick="addWater(300)"><div class="w-icon">☕</div><div class="w-amount">+300ml</div></div>
    <div class="water-btn" onclick="addWater(500)"><div class="w-icon">🍼</div><div class="w-amount">+500ml</div></div>`;

  // Timeline / reminders - adjusted to work schedule
  let times = [
    {t:'08:15', h:8}, {t:'09:15', h:9}, {t:'10:15', h:10}, {t:'11:00', h:11},
    {t:'13:30', h:13}, {t:'14:30', h:14}, {t:'15:30', h:15}, {t:'16:30', h:16},
    {t:'17:30', h:17}, {t:'21:00', h:21}
  ];
  let perTime = Math.round(target / times.length);
  let nowHour = new Date().getHours();
  let nowMin = new Date().getMinutes();
  let nowTotal = nowHour * 60 + nowMin;
  let html = '<div class="tl-title">智能饮水计划</div>';
  html += '<div style="font-size:12px;color:var(--text-light);margin-bottom:8px">根据体重'+user.weight+'kg计算，每日目标'+target+'ml（8:10到公司开始；12-13点午休跳过；19:50运动时自行饮水）</div>';
  times.forEach(item => {
    let [th, tm] = item.t.split(':').map(Number);
    let itemTotal = th * 60 + tm;
    let status = itemTotal < nowTotal - 5 ? 'done' : (itemTotal <= nowTotal + 30 ? 'pending' : 'pending');
    let label = itemTotal < nowTotal - 5 ? '已过' : (itemTotal <= nowTotal + 30 ? '现在' : '待完成');
    html += `<div class="tl-item">
      <span class="tl-time">${item.t}</span>
      <span class="tl-amount">建议${perTime}ml</span>
      <span class="tl-status ${status}">${label}</span>
    </div>`;
  });
  if(record.water.length > 0){
    html += '<div class="tl-title" style="margin-top:12px">今日饮水记录</div>';
    record.water.forEach(w => {
      html += `<div class="tl-item">
        <span class="tl-time">${w.time}</span>
        <span class="tl-amount">${w.amount}ml</span>
      </div>`;
    });
  }
  document.getElementById('water-timeline').innerHTML = html;
}

function addWater(amount){
  let today = Calc.today();
  let user = Store.getUser();
  let record = Store.getDay(today);
  let now = new Date();
  let timeStr = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  record.water.push({time:timeStr, amount:amount});
  // Auto-check water if >= 80%
  let total = Calc.waterTotal(record);
  let target = Calc.waterTarget(user);
  if(total >= target * 0.8) record.checkIns.water = true;
  Store.setDay(today, record);
  toast('已记录饮水 +'+amount+'ml (今日累计'+total+'ml)');
  renderWater();
}

function renderCheckin(){
  let today = Calc.today();

  // Check-in items
  let ci = record.checkIns;
  let items = [
    {key:'diet', icon:'🍳', name:'饮食达标', desc:ci.diet?'今日热量在目标范围内':'摄入热量80%-115%目标'},
    {key:'exercise', icon:'🏃', name:'运动达标', desc:ci.exercise?'今日运动≥30分钟':'运动满30分钟'},
    {key:'water', icon:'💧', name:'饮水达标', desc:ci.water?'今日饮水达标':'饮水达目标80%'},
    {key:'weight', icon:'⚖️', name:'体重记录', desc:ci.weight?'今日已称重':'记录今日体重'}
  ];
  let html = '';
  items.forEach(item => {
    let done = ci[item.key];
    html += `<div class="checkin-item ${done?'done':''}" onclick="toggleCheckin('${item.key}')">
      <div class="ci-icon">${done?'✅':item.icon}</div>
      <div class="ci-name">${item.name}</div>
      <div class="ci-status">${done?'已完成' : '点击完成'}</div>
    </div>`;
  });
  document.getElementById('checkin-grid').innerHTML = html;

  // Weekly stats
  let days = ['日','一','二','三','四','五','六'];
  let now = new Date();
  let weekStart = new Date(now);
  weekStart.setDate(now.getDate() - now.getDay());
  let bars = '';
  for(let i = 0; i < 7; i++){
    let d = new Date(weekStart);
    d.setDate(weekStart.getDate() + i);
    let dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    let r = Store.getDay(dateStr);
    let doneCount = Object.values(r.checkIns).filter(v=>v).length;
    let height = (doneCount / 4) * 80;
    let isToday = dateStr === today;
    bars += `<div class="week-bar-wrap">
      <div class="week-bar ${isToday?'active':''}" style="height:${Math.max(4,height)}px"></div>
      <div class="week-day">${days[i]}</div>
    </div>`;
  }
  document.getElementById('checkin-weekly').innerHTML = `
    <div class="ws-title">本周打卡完成率</div>
    <div class="week-bars">${bars}</div>`;
}

function toggleCheckin(key){
  let today = Calc.today();
  let record = Store.getDay(today);
  record.checkIns[key] = !record.checkIns[key];
  Store.setDay(today, record);

  // Update streak
  let allDone = Object.values(record.checkIns).every(v=>v);
  let streak = Store.getStreak();
  if(allDone && streak.lastDate !== today){
    let yesterday = new Date();
    yesterday.setDate(yesterday.getDate()-1);
    let yStr = yesterday.getFullYear()+'-'+String(yesterday.getMonth()+1).padStart(2,'0')+'-'+String(yesterday.getDate()).padStart(2,'0');
    if(streak.lastDate === yStr) streak.consecutive += 1;
    else streak.consecutive = 1;
    streak.lastDate = today;
    streak.total += 1;
    Store.setStreak(streak);
    toast('🎉 全部完成！连续打卡'+streak.consecutive+'天');
  } else if(!allDone && streak.lastDate === today){
    // Uncheck something after all done - undo streak
    streak.consecutive = Math.max(0, streak.consecutive - 1);
    streak.total = Math.max(0, streak.total - 1);
    let prevDate = new Date();
    prevDate.setDate(prevDate.getDate()-1);
    streak.lastDate = prevDate.getFullYear()+'-'+String(prevDate.getMonth()+1).padStart(2,'0')+'-'+String(prevDate.getDate()).padStart(2,'0');
    Store.setStreak(streak);
  }
  renderCheckin();
}

function renderWeightChart(weights, user){
  let el = document.getElementById('profile-chart');
  el.innerHTML = '<div class="card-title">📈 体重趋势</div><canvas id="weight-canvas" width="400" height="160"></canvas>';
  let canvas = document.getElementById('weight-canvas');
  if(!canvas) return;
  let ctx = canvas.getContext('2d');
  let w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);

  if(weights.length === 0){
    ctx.fillStyle = '#999';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('还没有体重记录，去"我的"记录今日体重吧', w/2, h/2);
    return;
  }

  let data = weights.slice(-14); // last 14 records
  let minW = Math.min(...data.map(d=>d.weight), user.targetWeight) - 1;
  let maxW = Math.max(...data.map(d=>d.weight), user.startWeight) + 1;
  let padL = 40, padR = 10, padT = 20, padB = 25;
  let cw = w - padL - padR, ch = h - padT - padB;

  // Target line
  let targetY = padT + ch - ((user.targetWeight - minW) / (maxW - minW)) * ch;
  ctx.strokeStyle = '#2196F3';
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.moveTo(padL, targetY);
  ctx.lineTo(w - padR, targetY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#2196F3';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('目标'+user.targetWeight, padL, targetY-3);

  // Data line
  ctx.strokeStyle = '#4CAF50';
  ctx.lineWidth = 2;
  ctx.beginPath();
  data.forEach((d, i) => {
    let x = padL + (cw / Math.max(1, data.length-1)) * i;
    let y = padT + ch - ((d.weight - minW) / (maxW - minW)) * ch;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    // Point
    ctx.fillStyle = '#4CAF50';
    ctx.beginPath();
    ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fill();
  });
  ctx.stroke();

  // Labels
  ctx.fillStyle = '#999';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(maxW.toFixed(0), padL-3, padT+5);
  ctx.fillText(minW.toFixed(0), padL-3, padT+ch);
  // Date labels
  ctx.textAlign = 'center';
  if(data.length > 0){
    let firstDate = data[0].date.slice(5);
    let lastDate = data[data.length-1].date.slice(5);
    ctx.fillText(firstDate, padL, h-8);
    ctx.fillText(lastDate, w-padR, h-8);
  }
}

      <div class="edit-title">记录今日体重</div>
      <div class="edit-field">
        <label>今日体重 (kg)</label>
        <input type="number" id="rw-weight" value="${user.weight}" step="0.1" min="30" max="200" autofocus>
      </div>
      <div class="edit-btns">
        <button class="btn-cancel" onclick="document.getElementById('weight-modal').remove()">取消</button>
        <button class="btn-save" onclick="saveTodayWeight()">保存</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function saveTodayWeight(){
  let weight = parseFloat(document.getElementById('rw-weight').value);
  if(!weight || weight < 30 || weight > 200){ toast('请输入合理体重'); return; }
  let today = Calc.today();
  let user = Store.getUser();
  user.weight = weight;
  Store.setUser(user);
  Store.addWeight(today, weight);
  let record = Store.getDay(today);
  record.weight = weight;
  record.checkIns.weight = true;
  Store.setDay(today, record);
  document.getElementById('weight-modal').remove();
  toast('体重已记录: '+weight+'kg');
  renderProfile();
  // Update streak if all done
  let allDone = Object.values(record.checkIns).every(v=>v);
  if(allDone) callCheckinStreak(today);
}

// Fix: streak update helper
function callCheckinStreak(today){
  let streak = Store.getStreak();
  if(streak.lastDate !== today){
    let yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
    let yStr = yesterday.getFullYear()+'-'+String(yesterday.getMonth()+1).padStart(2,'0')+'-'+String(yesterday.getDate()).padStart(2,'0');
    if(streak.lastDate === yStr) streak.consecutive += 1;
    else streak.consecutive = 1;
    streak.lastDate = today;
    streak.total += 1;
    Store.setStreak(streak);
  }
}

function nextTip(){
  let idx = Store.getTipIndex();
  Store.setTipIndex((idx + 1) % TIPS_DB.length);
  toast('已切换到下一条知识');
  renderProfile();
  if(document.getElementById('page-tips').classList.contains('active')) renderTips();
  if(document.getElementById('page-home').classList.contains('active')) renderHome();
}

function exportData(){
  let data = Store.exportData();
  let blob = new Blob([data], {type:'application/json'});
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = 'diet-data-'+Calc.today()+'.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('数据已导出');
}

// ==================== DAILY TIP ROTATION ====================

function rotateDailyTip(){
  let lastDate = localStorage.getItem('diet_tip_date');
  let today = Calc.today();
  if(lastDate !== today){
    let idx = Store.getTipIndex();
    Store.setTipIndex((idx + 1) % TIPS_DB.length);
    localStorage.setItem('diet_tip_date', today);
  }
}

// ==================== WATER REMINDER (in-page) ====================

let waterReminderInterval = null;
function startWaterReminder(){
  if(waterReminderInterval) clearInterval(waterReminderInterval);
  let waterTimes = ['08:15','09:15','10:15','11:00','13:30','14:30','15:30','16:30','17:30','21:00'];
  waterReminderInterval = setInterval(()=>{
    let user = Store.getUser();
    let today = Calc.today();
    let record = Store.getDay(today);
    let total = Calc.waterTotal(record);
    let target = Calc.waterTarget(user);
    if(total < target){
      let now = new Date();
      let hh = String(now.getHours()).padStart(2,'0');
      let mm = String(now.getMinutes()).padStart(2,'0');
      let nowStr = hh+':'+mm;
      if(waterTimes.includes(nowStr)){
        toast('💧 该喝水了！今日已喝'+total+'ml，目标'+target+'ml');
      }
    }
  }, 60000);
}

// ==================== INIT ====================

function init(){
  // First-time setup
  let user = Store.getUser();
  if(!localStorage.getItem('diet_init')){
    // Add initial weight
    Store.addWeight(Calc.today(), user.weight);
    localStorage.setItem('diet_init', '1');
  }
  // Rotate daily tip
  rotateDailyTip();
  // Start water reminder
  startWaterReminder();
  // Render home
  renderHome();
}

// Start app
init();
</script>
